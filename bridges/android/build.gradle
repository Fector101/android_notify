// Root project; the Android library lives in :android-notify-music-bridge
// (Maven artifact io.github.fector101:android-notify-music-bridge).

plugins {
    id 'io.github.gradle-nexus.publish-plugin' version '2.0.0'
}

nexusPublishing {
    repositories {
        sonatype { // Central Publisher Portal (OSSRH Staging API compatibility service)
            nexusUrl.set(uri("https://ossrh-staging-api.central.sonatype.com/service/local/"))
            snapshotRepositoryUrl.set(uri("https://central.sonatype.com/repository/maven-snapshots/"))
            stagingProfileId = "io.github.fector101"
            username = providers.gradleProperty("sonatypeUsername").orElse("").get()
            password = providers.gradleProperty("sonatypePassword").orElse("").get()
        }
    }
}