plugins {
    id("com.android.library")
    id("maven-publish")
    id("signing")
}

android {
    namespace = "org.android_notify.music"
    compileSdk = 35

    defaultConfig {
        minSdk = 23
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
        }
    }
}

def readVersionFromChangelog() {
    def repoRoot = rootProject.projectDir.parentFile.parentFile
    def changelog = new File(repoRoot, "changelog/android-notify-music-bridge.md")
    if (!changelog.isFile()) {
        throw new GradleException("Missing changelog at ${changelog}")
    }
    def pattern = ~/^## \[([^\]]+)\]/
    for (line in changelog.readLines("UTF-8")) {
        def matcher = pattern.matcher(line.trim())
        if (!matcher.find()) {
            continue
        }
        def version = matcher.group(1).trim()
        if (version.equalsIgnoreCase("unreleased")) {
            continue
        }
        return version
    }
    throw new GradleException("No release version in changelog/android-notify-music-bridge.md")
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = findProperty("bridgeGroupId") ?: "io.github.fector101"
                artifactId = findProperty("bridgeArtifactId") ?: "android-notify-music-bridge"
                version = findProperty("bridgeVersion") ?: readVersionFromChangelog()
                from components.release

                pom {
                    name = "android-notify-music-bridge"
                    description = "Java bridge for Android Notify music notifications: MediaSession.Callback transport-control forwarding."
                    url = "https://android-notify.vercel.app"
                    licenses {
                        license {
                            name = "MIT"
                            url = "https://github.com/Fector101/android_notify/blob/main/LICENSE"
                        }
                    }
                    developers {
                        developer {
                            id = "fector101"
                            name = "Fabian"
                            email = "fector101@yahoo.com"
                        }
                    }
                    scm {
                        connection = "scm:git:git://github.com/Fector101/android_notify.git"
                        developerConnection = "scm:git:ssh://github.com/Fector101/android_notify.git"
                        url = "https://github.com/Fector101/android_notify"
                    }
                }
            }
        }
    }

    // Sign only when a key is provided (CI sets ORG_GRADLE_PROJECT_signingKey).
    // publishToMavenLocal / local smoke builds do not need signatures.
    def signingKey = providers.gradleProperty("signingKey").orNull
    if (signingKey) {
        def signingPassword = providers.gradleProperty("signingPassword").orNull
        signing {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.release
        }
    }
}