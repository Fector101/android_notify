# Builds the android-notify-music-bridge, a x86_64 emulator APK, and runs the music
# notification logcat smoke test (same path as local `scripts/ci/docker_android_test.sh`).
# Requires native Docker Engine + KVM on the runner (ubuntu-latest), not Docker Desktop.
name: Music smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      SKIP_AUTH: "true"
      ANDROID_EMU_MEMORY: "4096"
      ANDROID_EMU_SHM: "2gb"
      ANDROID_EMU_CORES: "2"
      ANDROID_BOOT_TIMEOUT: "600"
      LOG_TIMEOUT: "180"
    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM for nested emulator (/dev/kvm → container)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && echo "KVM present" || { echo "KVM missing"; exit 1; }

      - name: "Run docker_android_test.sh (bridge → APK → emulator smoke)"
        run: |
          chmod +x scripts/ci/*.sh
          ./scripts/ci/docker_android_test.sh

      - name: Teardown emulator stack
        if: always()
        run: |
          ./scripts/ci/docker_compose.sh -f docker-compose.android.yml down -v --remove-orphans 2>/dev/null || true